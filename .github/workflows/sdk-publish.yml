name: Publish reviewed SDK artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed merged release tag, for example v0.6.0
        required: true
      preparation_run_id:
        description: Successful Prepare SDK release artifacts run ID
        required: true
      dry_run:
        description: Verify artifacts and report the plan without publishing
        type: boolean
        default: true
        required: true
permissions:
  contents: write
  actions: read
concurrency:
  group: sdk-publication-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publication:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      PREPARATION_RUN_ID: ${{ inputs.preparation_run_id }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - name: Check out reviewed publisher revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: publisher
          fetch-depth: 0
      - name: Check out immutable SDK release source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          path: release-source
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify source, successful preparation and disk capacity
        run: |
          set -euo pipefail
          python publisher/scripts/verify_release_source.py --source-root release-source --tag "$RELEASE_TAG" --output dist/publication-source.json
          [[ "$PREPARATION_RUN_ID" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PREPARATION_RUN_ID" > dist/preparation-run.json
          python - <<'PY'
          import json, shutil
          run = json.load(open('dist/preparation-run.json'))
          assert run['conclusion'] == 'success' and run['event'] == 'workflow_dispatch'
          assert run['path'] == '.github/workflows/sdk-release.yml'
          assert shutil.disk_usage('.').free >= 6 * 1024**3, 'Need 6 GiB free on publication runner'
          PY
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preparation_run_id }}
          pattern: reviewed-sdk-release-candidate-*
          path: dist/prepared-artifacts
      - name: Verify all assets and optionally publish
        run: |
          set -euo pipefail
          options=()
          if [ "$DRY_RUN" = false ]; then options+=(--publish); fi
          python publisher/scripts/prepare_sdk_publication.py \
            --artifacts dist/prepared-artifacts --output dist/publication \
            --source dist/publication-source.json --run dist/preparation-run.json \
            --repository "$GITHUB_REPOSITORY" --publisher-sha "$GITHUB_SHA" \
            "${options[@]}" | tee dist/publication-plan.json
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-publication-plan
          path: |
            dist/publication-plan.json
            dist/publication/validation-receipt.json
            dist/publication/SHA256SUMS
          retention-days: 30

  pypi:
    needs: publication
    if: inputs.dry_run == false
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: pypi
    permissions:
      id-token: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.8.2
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.preparation_run_id }}
          name: reviewed-sdk-release-candidate-core
          path: dist/prepared
      - uses: actions/download-artifact@v4
        with:
          name: sdk-publication-plan
          path: dist/plan
      - name: Verify distributions against publication plan
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path

          plans = list(Path("dist/plan").rglob("publication-plan.json"))
          assert len(plans) == 1, f"Expected one publication-plan.json, found {plans}"
          plan = json.loads(plans[0].read_text())
          assert plan["publication_status"] == "published", plan["publication_status"]
          assert plan["tag"] == os.environ["RELEASE_TAG"], plan["tag"]

          dist_assets = [
              asset for asset in plan["assets"]
              if asset["name"].endswith(".whl") or asset["name"].endswith(".tar.gz")
          ]
          assert {a["name"].split(".")[-1] for a in dist_assets} == {"whl", "gz"}
          assert len(dist_assets) == 2, dist_assets

          pypi_dir = Path("dist/pypi")
          pypi_dir.mkdir(parents=True, exist_ok=True)
          for asset in dist_assets:
              src = Path("dist/prepared") / asset["name"]
              assert src.is_file(), f"Missing distribution {src}"
              data = src.read_bytes()
              assert len(data) == asset["bytes"], asset["name"]
              assert hashlib.sha256(data).hexdigest() == asset["sha256"], asset["name"]
              shutil.copy2(src, pypi_dir / asset["name"])
          PY
      - name: Publish distributions to PyPI via trusted publishing
        run: uv publish --trusted-publishing always dist/pypi/*
