name: Run-guide CPU smoke checks
# Runs documented run guides (scripts/recipe_smoke/guides, copied from the rewire benchmark
# store) on CPU with shrunk inputs, and checks each reaches evaluation and writes its documented
# outputs. Guides that cannot be smoke-tested as written have follow-up issues (see #61).
# Each job uploads a receipt with the upstream revision, deviations, resolved versions and
# output SHA-256s. External hosts are involved, so this does not gate unrelated PRs.
on:
  pull_request:
    paths:
      - 'scripts/recipe_smoke/**'
      - '.github/workflows/recipe-smoke.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    name: ${{ matrix.recipe }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - recipe: mfass_v2
            timeout: 30
          - recipe: beeline
            timeout: 60
          - recipe: scib
            timeout: 120
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v4
      - name: Runner resources
        run: nproc; free -h; df -h "$RUNNER_TEMP" "$HOME"
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.2'
      - name: User-writable Miniforge (scIB needs mamba and a writable package cache)
        if: matrix.recipe == 'scib'
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          auto-activate-base: true
          activate-environment: ''
      - name: Run guide smoke
        run: bash scripts/recipe_smoke/${{ matrix.recipe }}.sh
      - name: Disk after run
        if: always()
        run: df -h "$RUNNER_TEMP" "$HOME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.recipe }}
          path: |
            ${{ runner.temp }}/receipt-*.json
            ${{ runner.temp }}/*-freeze.txt
            ${{ runner.temp }}/*-outputs.txt
            ${{ runner.temp }}/*-image-digests.txt
          if-no-files-found: warn
