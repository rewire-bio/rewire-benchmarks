name: Prepare SDK release artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed immutable tag (v0.2.0 or later)
        required: true
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        environment: [core, esm, dnabert2, sequence]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked --all-packages --extra sequence
      - run: uv run --no-sync pytest packages/rewirebench/tests tests benchmarks/mfass/tests
      - run: uv build --package rewirebench
      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer version > dist/apptainer-version.txt
      - name: Build OCI and SIF artifacts
        env:
          ENVIRONMENT: ${{ matrix.environment }}
        run: |
          podman build --platform linux/amd64 --build-arg ENVIRONMENT="$ENVIRONMENT" -f containers/Containerfile -t "localhost/rewirebench:$ENVIRONMENT" .
          podman save --format oci-archive -o "dist/rewirebench-$ENVIRONMENT.oci.tar" "localhost/rewirebench:$ENVIRONMENT"
          apptainer build "dist/rewirebench-$ENVIRONMENT.sif" "oci-archive://$PWD/dist/rewirebench-$ENVIRONMENT.oci.tar"
          apptainer exec --cleanenv "dist/rewirebench-$ENVIRONMENT.sif" rewirebench protocols
          uv run --no-sync python containers/parity.py --environment "${{ matrix.environment }}" > dist/native-parity.json
          podman run --rm --network none --read-only --tmpfs /tmp:rw,size=512m --entrypoint python -v "$PWD:/workspace:ro" "localhost/rewirebench:$ENVIRONMENT" /workspace/containers/parity.py --environment "$ENVIRONMENT" > dist/podman-parity.json
          uv run --no-sync python containers/parity.py --compare dist/native-parity.json dist/podman-parity.json
          apptainer exec --cleanenv --bind "$PWD:/workspace:ro" "dist/rewirebench-$ENVIRONMENT.sif" python /workspace/containers/parity.py --environment "${{ matrix.environment }}" > dist/apptainer-parity.json
          uv run --no-sync python containers/parity.py --compare dist/native-parity.json dist/apptainer-parity.json
          cd dist
          sha256sum *.whl *.tar.gz *.oci.tar *.sif > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-sdk-release-candidate-${{ matrix.environment }}
          path: dist/
          retention-days: 7
