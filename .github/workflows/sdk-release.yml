name: Prepare SDK release artifacts
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed immutable tag (v0.2.0 or later)
        required: true
permissions:
  contents: read
jobs:
  artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked
      - run: uv run --no-sync pytest packages/rewirebench/tests tests benchmarks/mfass/tests
      - run: uv build --package rewirebench
      - name: Install Apptainer
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          apptainer version > dist/apptainer-version.txt
      - name: Build OCI and SIF artifacts
        run: |
          for environment in core esm dnabert2; do
            podman build --platform linux/amd64 --build-arg ENVIRONMENT="$environment" -f containers/Containerfile -t "localhost/rewirebench:$environment" .
            podman save --format oci-archive -o "dist/rewirebench-$environment.oci.tar" "localhost/rewirebench:$environment"
            apptainer build "dist/rewirebench-$environment.sif" "oci-archive://$PWD/dist/rewirebench-$environment.oci.tar"
            apptainer exec --cleanenv "dist/rewirebench-$environment.sif" rewirebench protocols
          done
          uv run --no-sync python containers/parity.py > dist/native-parity.json
          apptainer exec --cleanenv --bind "$PWD:/workspace:ro" dist/rewirebench-core.sif python /workspace/containers/parity.py > dist/apptainer-parity.json
          diff dist/native-parity.json dist/apptainer-parity.json
          cd dist
          sha256sum *.whl *.tar.gz *.oci.tar *.sif > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-sdk-release-candidate
          path: dist/
          retention-days: 7
