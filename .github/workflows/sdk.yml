name: SDK checks
on:
  pull_request:
  push:
    branches: [main, 'codex/benchmark-python-sdk']
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        environment: [core, esm, dnabert2]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked
      - run: uv run --no-sync pytest packages/rewirebench/tests tests benchmarks/mfass/tests
      - run: uv build --package rewirebench
      - run: uv run --no-sync python containers/parity.py > /tmp/native.json
      - name: Build and verify with Podman
        run: |
          podman build --platform linux/amd64 --build-arg ENVIRONMENT="${{ matrix.environment }}" -f containers/Containerfile -t localhost/rewirebench:check .
          podman run --rm --network none --read-only --entrypoint python -v "$PWD:/workspace:ro" localhost/rewirebench:check /workspace/containers/parity.py > /tmp/container.json
          diff /tmp/native.json /tmp/container.json
          podman run --rm --network none --read-only localhost/rewirebench:check protocols
      - name: Verify optional CPU framework imports
        if: matrix.environment != 'core'
        run: |
          podman run --rm --network none --read-only --entrypoint python localhost/rewirebench:check -c "import torch; assert torch.__version__ == '2.2.2+cpu'; assert torch.version.cuda is None; import ${{ matrix.environment == 'esm' && 'esm' || 'transformers' }}"
      - name: Verify Apptainer SIF execution
        run: |
          sudo add-apt-repository -y ppa:apptainer/ppa
          sudo apt-get update
          sudo apt-get install -y apptainer
          podman save --format oci-archive -o /tmp/rewirebench.oci.tar localhost/rewirebench:check
          apptainer build dist/rewirebench-${{ matrix.environment }}.sif oci-archive:///tmp/rewirebench.oci.tar
          apptainer exec --cleanenv --bind "$PWD:/workspace:ro" dist/rewirebench-${{ matrix.environment }}.sif python /workspace/containers/parity.py > /tmp/apptainer.json
          diff /tmp/native.json /tmp/apptainer.json
          sha256sum dist/rewirebench-${{ matrix.environment }}.sif > dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rewirebench-${{ matrix.environment }}-wheel-and-parity
          path: |
            dist/*
            /tmp/native.json
            /tmp/container.json
            /tmp/apptainer.json
