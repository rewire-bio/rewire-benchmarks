name: Recipe receipt check
# Runs the executed CPU recipe from recipes/ with `rewirebench recipe run`, then re-checks the
# receipt with `rewirebench receipt verify`. The inputs come from GitHub (80 MB), so this runs
# only when recipes or the receipt code change, and weekly. It never uses a GPU or paid compute.
on:
  pull_request:
    paths:
      - 'recipes/**'
      - 'packages/rewirebench/src/rewirebench/recipes.py'
      - 'packages/rewirebench/src/rewirebench/receipts.py'
      - 'packages/rewirebench/src/rewirebench/cli.py'
      - 'uv.lock'
      - '.github/workflows/recipe-receipt.yml'
  schedule:
    - cron: '43 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mfass-v2-kmer-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUN_DIR: ${{ runner.temp }}/mfass-v2-kmer-baseline
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.2'
      - run: uv sync --locked --package rewirebench --python 3.11
      - name: Validate every recipe
        run: uv run --no-sync rewirebench recipe validate
      - name: Run the recipe and write its receipt
        run: uv run --no-sync rewirebench recipe run mfass-v2-kmer-baseline --output "$RUN_DIR"
      - name: Verify the receipt
        run: uv run --no-sync rewirebench receipt verify "$RUN_DIR"
      - name: Show the receipt
        if: always()
        run: cat "$RUN_DIR/receipt.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recipe-receipt-mfass-v2-kmer-baseline
          path: ${{ runner.temp }}/mfass-v2-kmer-baseline
          if-no-files-found: ignore
