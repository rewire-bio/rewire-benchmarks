name: Model recipe receipt check
# Runs the six pretrained-model recipes on CPU with `rewirebench recipe run`, then re-checks
# each receipt with `rewirebench receipt verify --strict`. `recipe run` fetches the pinned
# checkpoint files and data from their https URLs and checks each SHA-256; the checkpoint
# folder is the inputs folder. A run downloads up to 3.1 GB of weights, so this runs only when
# these adapters, their pins, their recipes, the registry or the lock change. It never uses a
# GPU or paid compute.
on:
  pull_request:
    paths:
      - 'packages/rewirebench/src/rewirebench/adapters/pinned.py'
      - 'packages/rewirebench/src/rewirebench/adapters/mistral_dna.py'
      - 'packages/rewirebench/src/rewirebench/adapters/dnabert_s.py'
      - 'packages/rewirebench/src/rewirebench/adapters/plantrna_fm.py'
      - 'packages/rewirebench/src/rewirebench/adapters/protbert.py'
      - 'packages/rewirebench/src/rewirebench/adapters/esm1b.py'
      - 'packages/rewirebench/src/rewirebench/adapters/protgpt2.py'
      - 'packages/rewirebench/src/rewirebench/resources/models/hf-trees/**'
      - 'packages/rewirebench/src/rewirebench/models.py'
      - 'packages/rewirebench/pyproject.toml'
      - 'recipes/mfass/mfass-v2-mistral-dna-frozen-smoke.yaml'
      - 'recipes/mfass/mfass-v2-dnabert-s-frozen-smoke.yaml'
      - 'recipes/mrnabench/mrnabench-plantrna-fm-smoke.yaml'
      - 'recipes/flip2/flip2-protbert-synthetic-smoke.yaml'
      - 'recipes/proteingym/proteingym-v1-3-esm1b-synthetic-smoke.yaml'
      - 'recipes/proteingym/proteingym-v1-3-protgpt2-synthetic-smoke.yaml'
      - 'uv.lock'
      - '.github/workflows/model-recipe-receipt.yml'
  push:
    branches: [main]
    paths:
      - 'packages/rewirebench/src/rewirebench/adapters/pinned.py'
      - 'packages/rewirebench/src/rewirebench/adapters/mistral_dna.py'
      - 'packages/rewirebench/src/rewirebench/adapters/dnabert_s.py'
      - 'packages/rewirebench/src/rewirebench/adapters/plantrna_fm.py'
      - 'packages/rewirebench/src/rewirebench/adapters/protbert.py'
      - 'packages/rewirebench/src/rewirebench/adapters/esm1b.py'
      - 'packages/rewirebench/src/rewirebench/adapters/protgpt2.py'
      - 'packages/rewirebench/src/rewirebench/resources/models/hf-trees/**'
      - 'packages/rewirebench/src/rewirebench/models.py'
      - 'packages/rewirebench/pyproject.toml'
      - 'recipes/mfass/mfass-v2-mistral-dna-frozen-smoke.yaml'
      - 'recipes/mfass/mfass-v2-dnabert-s-frozen-smoke.yaml'
      - 'recipes/mrnabench/mrnabench-plantrna-fm-smoke.yaml'
      - 'recipes/flip2/flip2-protbert-synthetic-smoke.yaml'
      - 'recipes/proteingym/proteingym-v1-3-esm1b-synthetic-smoke.yaml'
      - 'recipes/proteingym/proteingym-v1-3-protgpt2-synthetic-smoke.yaml'
      - 'uv.lock'
      - '.github/workflows/model-recipe-receipt.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-recipe:
    name: ${{ matrix.recipe }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - recipe: mfass-v2-mistral-dna-frozen-smoke
            extras: --extra mistral-dna
          - recipe: mfass-v2-dnabert-s-frozen-smoke
            extras: --extra dnabert-s
          - recipe: mrnabench-plantrna-fm-smoke
            extras: --extra plantrna-fm --extra sequence
          - recipe: flip2-protbert-synthetic-smoke
            extras: --extra protbert
          - recipe: proteingym-v1-3-esm1b-synthetic-smoke
            extras: --extra esm1b
          - recipe: proteingym-v1-3-protgpt2-synthetic-smoke
            extras: --extra protgpt2
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # On a pull request the default checkout is a temporary merge commit that is on no
      # branch. The receipt must cite a commit a reader can find, so check out the PR head.
      RUN_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Free disk for torch and the weights
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h "$RUNNER_TEMP" "$HOME"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.8.2'
      - run: uv sync --locked --package rewirebench ${{ matrix.extras }} --python 3.11
      - name: Run the recipe and write its receipt
        run: uv run --no-sync rewirebench recipe run "${{ matrix.recipe }}" --output "$RUNNER_TEMP/${{ matrix.recipe }}"
      - name: Verify the receipt, including a clean code commit and a committed recipe
        run: uv run --no-sync rewirebench receipt verify "$RUNNER_TEMP/${{ matrix.recipe }}" --strict
      - name: Check the receipt cites the commit under test
        env:
          RECIPE: ${{ matrix.recipe }}
        run: |
          python3 - <<'PY'
          import json, os
          receipt = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], os.environ["RECIPE"], "receipt.json")))
          wanted = os.environ["RUN_COMMIT"]
          assert receipt["code"]["commit"] == wanted, receipt["code"]
          assert receipt["recipe"]["commit"] == wanted, receipt["recipe"]
          assert receipt["code"]["dirty"] is False, receipt["code"]
          PY
      - name: Show the receipt
        if: always()
        run: cat "$RUNNER_TEMP/${{ matrix.recipe }}/receipt.json"
      - name: Disk after the run
        if: always()
        run: df -h "$RUNNER_TEMP" "$HOME"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recipe-receipt-${{ matrix.recipe }}
          path: ${{ runner.temp }}/${{ matrix.recipe }}
          if-no-files-found: ignore
