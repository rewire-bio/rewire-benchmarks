name: Runner image
# Builds the CPU runner image (containers/Containerfile, environments core and sequence) for
# linux/amd64 and linux/arm64, each on a runner of its own architecture, and checks each build
# against the native environment. A pull request stops there and pushes nothing.
# On main, and on a manual run from main, the checked images are pushed to
# ghcr.io/rewire-bio/rewirebench as one manifest per environment that covers both platforms.
# The digests are printed, and the pushed linux/amd64 image is pulled by digest and checked
# again. See docs/spark.md, "Published images".
on:
  pull_request:
    paths:
      - 'containers/**'
      - 'packages/rewirebench/**'
      - 'uv.lock'
      - '.github/workflows/image.yml'
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - 'packages/rewirebench/**'
      - 'uv.lock'
      - '.github/workflows/image.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  IMAGE: ghcr.io/rewire-bio/rewirebench
jobs:
  build:
    name: build ${{ matrix.environment }} linux/${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        environment: [core, sequence]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            machine: x86_64
          - arch: arm64
            runner: ubuntu-24.04-arm
            machine: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      TAG: ${{ matrix.environment }}-${{ github.sha }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
      - name: The runner has the architecture it builds for
        run: test "$(uname -m)" = "${{ matrix.machine }}"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked --all-packages --extra sequence
      - run: uv build --package rewirebench
      - run: uv run --no-sync python containers/parity.py --environment "${{ matrix.environment }}" > /tmp/native.json
      - name: Build
        # No provenance or SBOM attestation: with one, the pushed platform image would be an
        # index of its own and its digest would not be the digest of a platform manifest.
        run: |
          docker buildx build --load --platform "linux/${{ matrix.arch }}" \
            --provenance=false --sbom=false \
            --build-arg ENVIRONMENT="${{ matrix.environment }}" \
            --label "org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.licenses=MIT" \
            -f containers/Containerfile -t "$IMAGE:$TAG" .
          test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "$IMAGE:$TAG")" = "linux/${{ matrix.arch }}"
          test "$(docker run --rm --network none --entrypoint python "$IMAGE:$TAG" -c 'import platform; print(platform.machine())')" = "${{ matrix.machine }}"
      - name: Check the image
        run: containers/check_image.sh docker "$IMAGE:$TAG" "${{ matrix.environment }}" /tmp/native.json /tmp/container.json
      - name: Verify sequence file readers
        if: matrix.environment == 'sequence'
        run: docker run --rm --network none --read-only --entrypoint python "$IMAGE:$TAG" -c "import pandas, pyarrow, h5py"
      - name: Save the checked image for the publish job
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: docker save -o "$RUNNER_TEMP/$TAG.tar" "$IMAGE:$TAG"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          name: image-${{ matrix.environment }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/${{ env.TAG }}.tar
          retention-days: 1
          if-no-files-found: error

  publish:
    name: push to GHCR
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      core_amd64: ${{ steps.push.outputs.core_amd64 }}
      sequence_amd64: ${{ steps.push.outputs.sequence_amd64 }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: ${{ runner.temp }}/images
      - name: Push each platform, then one manifest for both
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          trap 'docker logout ghcr.io' EXIT
          digest_of() { docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' | jq -er .digest; }
          echo '{}' > image-digests.json
          for environment in core sequence; do
            tag="$environment-$GITHUB_SHA"
            for arch in amd64 arm64; do
              docker load -i "$RUNNER_TEMP/images/$tag-$arch.tar"
              docker push "$IMAGE:$tag-$arch"
              # Each platform must be a single image manifest, not an index.
              docker buildx imagetools inspect --raw "$IMAGE:$tag-$arch" \
                | jq -e '(has("manifests") | not) and .config.digest != null' > /dev/null
            done
            amd64=$(digest_of "$IMAGE:$tag-amd64")
            arm64=$(digest_of "$IMAGE:$tag-arm64")
            # Tags are for people. The tag <environment> follows main, and a rerun on one commit
            # pushes <environment>-<commit> again with new digests. Only a digest is stable.
            docker buildx imagetools create -t "$IMAGE:$tag" -t "$IMAGE:$environment" \
              "$IMAGE@$amd64" "$IMAGE@$arm64"
            manifest=$(digest_of "$IMAGE:$tag")
            # The manifest lists exactly the two platform images that were pushed.
            docker buildx imagetools inspect --raw "$IMAGE:$tag" | jq -e --arg amd64 "$amd64" --arg arm64 "$arm64" \
              '[.manifests[] | {key: (.platform.os + "/" + .platform.architecture), value: .digest}] | from_entries
               == {"linux/amd64": $amd64, "linux/arm64": $arm64}' > /dev/null
            for digest in "$manifest" "$amd64" "$arm64"; do
              echo "$digest" | grep -Eq '^sha256:[0-9a-f]{64}$'
            done
            jq --arg environment "$environment" --arg image "$IMAGE" --arg commit "$GITHUB_SHA" \
              --arg manifest "$manifest" --arg amd64 "$amd64" --arg arm64 "$arm64" \
              '.[$environment] = {image: $image, commit: $commit, manifest: $manifest,
                                  platforms: {"linux/amd64": $amd64, "linux/arm64": $arm64}}' \
              image-digests.json > image-digests.next.json
            mv image-digests.next.json image-digests.json
            echo "${environment}_amd64=$amd64" >> "$GITHUB_OUTPUT"
            {
              echo "### $environment"
              echo
              echo "| What | Reference |"
              echo "| --- | --- |"
              echo "| Manifest for both platforms | \`$IMAGE@$manifest\` |"
              echo "| linux/amd64 | \`$IMAGE@$amd64\` |"
              echo "| linux/arm64 | \`$IMAGE@$arm64\` |"
              echo
            } | tee -a "$GITHUB_STEP_SUMMARY"
          done
          cat image-digests.json
      - uses: actions/upload-artifact@v4
        with:
          name: image-digests
          path: image-digests.json
          if-no-files-found: error

  verify:
    name: check pushed ${{ matrix.environment }} linux/amd64
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        environment: [core, sequence]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    env:
      DIGEST: ${{ needs.publish.outputs[format('{0}_amd64', matrix.environment)] }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install uv==0.8.2
      - run: uv sync --locked --all-packages --extra sequence
      - run: uv run --no-sync python containers/parity.py --environment "${{ matrix.environment }}" > /tmp/native.json
      - name: Pull the pushed image by digest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The package is private until the owner makes it public, so pull with the job token.
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker pull --platform linux/amd64 "$IMAGE@$DIGEST"
          docker logout ghcr.io
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE@$DIGEST")" = "$GITHUB_SHA"
      - name: Check the pushed image
        run: containers/check_image.sh docker "$IMAGE@$DIGEST" "${{ matrix.environment }}" /tmp/native.json /tmp/container.json
