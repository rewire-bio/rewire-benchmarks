  - gpn-star-v/predictions.json
  - gpn-star-m/report.json
  - gpn-star-m/predictions.json
  - alphagenome-avi/report.json
  - alphagenome-avi/predictions.json
  - alphagenome-avi-phred/report.json
  - alphagenome-avi-phred/predictions.json
  - alphamissense/report.json
  - alphamissense/predictions.json
  - revel/report.json
  - revel/predictions.json
  - cadd-v1-7/report.json
  - cadd-v1-7/predictions.json
