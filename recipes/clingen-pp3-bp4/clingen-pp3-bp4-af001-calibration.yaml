estimate:
  gpu_hours: 0
  note: No GPU and no paid compute.
backends:
  local: {}
limitations:
  - Evaluates pinned precomputed variant score tables via the clingen-score-table adapter, not raw model inference from FASTA/MSA.
  - EVEE is intentionally excluded from this recipe because its published ClinVar-supervised table overlaps the held-out test window.
  - The local backend runs in the host Python environment, not in the container image named in environment.images.
