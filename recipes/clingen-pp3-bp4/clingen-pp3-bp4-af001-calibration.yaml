schema_version: "1.0"
id: clingen-pp3-bp4-af001-calibration
title: ClinGen PP3/BP4 local posterior calibration on rare post-2023-12 ClinVar missense SNVs (CPU)
summary: >-
  Prepares the AF<0.1% ClinGen PP3/BP4 held-out ClinVar missense benchmark cohort
  (5,454 P/LP, 2,687 B/LB, 6,312 gnomAD v3.1.2 reference variants) and calibrates eight
  unconfounded predictors with 1,000 conservative bootstrap resamples on CPU.
kind: benchmark_run
purpose: harness_run
scope: full_protocol
rewirebench_protocol: clingen-pp3-bp4-v1
kg_record_id: rewire-local-20261123-clingen-protocol-post-2023-12-af001
store_recipe_id: clingen-pp3-bp4-af001-calibration
licence:
  code: MIT
  weights: No model weights; evaluates pinned precomputed score tables for 8 predictors.
  data: ClinVar public domain and gnomAD v3.1.2 ODC-By; pinned cohort and score TSVs fetched by SHA-256.
environment:
  runtime: python
  python: ">=3.11"
  images:
    linux/amd64:
      reference: ghcr.io/rewire-bio/rewirebench@sha256:beb2537c26950553f0df1e61b161507d484511988848f7973b0190285fd4f55c
    linux/arm64:
      reference: ghcr.io/rewire-bio/rewirebench@sha256:0d9636331a18f40aadb35bf8f118b1811fd45491aafbeef6fa0db4ba9ade998c
hardware_floor:
  accelerator:
    kind: none
  host_memory_gb: 0.23
  wall_clock_seconds: 67.6
  basis: measured_by_rewire
  note: >-
    CPU only. Measured on 2026-11-24 on an Apple M4 (macOS arm64): 67.6 seconds across all
    eight non-leaked predictors (1,000 bootstraps each), peak resident memory 229 MB (excludes EVEE).
missing:
  weights_pin:
    reason: inapplicable
    note: Evaluates pinned precomputed variant score tables via the registered clingen-score-table adapter.
inputs:
