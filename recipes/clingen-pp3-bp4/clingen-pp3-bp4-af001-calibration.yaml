    url: https://raw.githubusercontent.com/rewire-bio/rewire-benchmarks/fbf4fd5df880ee685fa276dfa6a5bb46da4bcf73/benchmarks/clingen-pp3-bp4/cohorts/gnomad_ref_missense.tsv
    sha256: 818ad7178c61c6eeddb489d6969b98728895cd70baf95dcd3a3ec7008442ac83
    bytes: 522482
  - name: variants_post_2023_12.tsv
    url: https://raw.githubusercontent.com/rewire-bio/rewire-benchmarks/fbf4fd5df880ee685fa276dfa6a5bb46da4bcf73/benchmarks/clingen-pp3-bp4/cohorts/variants_post_2023_12.tsv
    sha256: 90ec52d2b5dcbc4019113e60bd4b3099bf4e0761c821c2f2c7055b2c8b650438
    bytes: 1271595
  - name: scores_gpnmsa.tsv
    url: https://raw.githubusercontent.com/rewire-bio/rewire-benchmarks/fbf4fd5df880ee685fa276dfa6a5bb46da4bcf73/benchmarks/clingen-pp3-bp4/scores/scores_gpnmsa.tsv
    sha256: b7d188f75c15a552e5d66df8f5fbdbb261779c42000d236e4e40cdf5355c9770
    bytes: 380995
  - name: scores_gpnstar_v.tsv
    url: https://raw.githubusercontent.com/rewire-bio/rewire-benchmarks/fbf4fd5df880ee685fa276dfa6a5bb46da4bcf73/benchmarks/clingen-pp3-bp4/scores/scores_gpnstar_v.tsv
    sha256: 05b681f74de63d5697174696b717c8aa0615402531e220c4a69423ec65eea1a9
    bytes: 412452
  - name: scores_gpnstar_m.tsv
    url: https://raw.githubusercontent.com/rewire-bio/rewire-benchmarks/fbf4fd5df880ee685fa276dfa6a5bb46da4bcf73/benchmarks/clingen-pp3-bp4/scores/scores_gpnstar_m.tsv
