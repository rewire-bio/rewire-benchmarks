commands:
  - name: prepare-grid-01-d2
    argv:
      - rewirebench
      - prepare
      - clingen-pp3-bp4-v1
      - --source
      - "{inputs}"
      - --output
      - "{work}/prepared_01_d2"
      - --options
      - '{"stratum": "post_2023_12_af001", "increment": 0.01, "decimals": 2}'
  - name: prepare-grid-005-d3
    argv:
      - rewirebench
      - prepare
      - clingen-pp3-bp4-v1
      - --source
      - "{inputs}"
      - --output
      - "{work}/prepared_005_d3"
      - --options
      - '{"stratum": "post_2023_12_af001", "increment": 0.005, "decimals": 3}'
  - name: prepare-grid-1-d1
    argv:
      - rewirebench
      - prepare
      - clingen-pp3-bp4-v1
      - --source
      - "{inputs}"
      - --output
      - "{work}/prepared_1_d1"
      - --options
      - '{"stratum": "post_2023_12_af001", "increment": 0.1, "decimals": 1}'
  - name: prepare-grid-001-d3
    argv:
      - rewirebench
      - prepare
      - clingen-pp3-bp4-v1
      - --source
      - "{inputs}"
      - --output
      - "{work}/prepared_001_d3"
      - --options
      - '{"stratum": "post_2023_12_af001", "increment": 0.001, "decimals": 3}'
  - name: run-gpn-msa
    argv:
      - rewirebench
      - run
      - --prepared
      - "{work}/prepared_01_d2"
      - --output
      - "{output}/gpn-msa"
      - --model
      - clingen-score-table
      - --model-name
      - GPN-MSA (-LLR)
      - --training-overlap
      - Unsupervised MSA language model; no ClinVar labels in training.
      - --batch-size
      - "4096"
      - --adapter-options
      - '{"artifact": "{inputs}/scores_gpnmsa.tsv", "artifact_sha256": "b7d188f75c15a552e5d66df8f5fbdbb261779c42000d236e4e40cdf5355c9770", "column": "gpn_msa"}'
  - name: run-gpn-star-v
    argv:
      - rewirebench
      - run
      - --prepared
      - "{work}/prepared_01_d2"
      - --output
      - "{output}/gpn-star-v"
      - --model
      - clingen-score-table
      - --model-name
      - GPN-Star vertebrate v100 (-LLR)
      - --training-overlap
      - Unsupervised vertebrate MSA model; no ClinVar labels in training.
      - --batch-size
      - "4096"
      - --adapter-options
      - '{"artifact": "{inputs}/scores_gpnstar_v.tsv", "artifact_sha256": "05b681f74de63d5697174696b717c8aa0615402531e220c4a69423ec65eea1a9", "column": "gpnstar_v"}'
  - name: run-gpn-star-m
    argv:
      - rewirebench
      - run
      - --prepared
      - "{work}/prepared_01_d2"
      - --output
      - "{output}/gpn-star-m"
      - --model
      - clingen-score-table
      - --model-name
      - GPN-Star mammal m447 (-LLR)
      - --training-overlap
      - Unsupervised mammalian MSA model; no ClinVar labels in training.
      - --batch-size
      - "4096"
      - --adapter-options
      - '{"artifact": "{inputs}/scores_gpnstar_m.tsv", "artifact_sha256": "fd7f857518e3966bee4e8c89b81ce1a4f143621faef5a2bef1828c802c0447ef", "column": "gpnstar_m"}'
  - name: run-alphagenome-avi
    argv:
      - rewirebench
      - run
      - --prepared
      - "{work}/prepared_005_d3"
      - --output
      - "{output}/alphagenome-avi"
      - --model
      - clingen-score-table
      - --model-name
      - AlphaGenome AVI (raw)
      - --training-overlap
      - No ClinVar supervision; trained on gnomAD allele-frequency structure (rare AF<0.1% stratum isolates label confounding).
      - --batch-size
      - "4096"
      - --adapter-options
      - '{"artifact": "{inputs}/scores_avi.tsv", "artifact_sha256": "9a873bf165a596f07f703c175532276700ed0aae55e9c87d29ea7541279e0501", "column": "avi"}'
  - name: run-alphagenome-avi-phred
    argv:
      - rewirebench
      - run
      - --prepared
      - "{work}/prepared_1_d1"
      - --output
      - "{output}/alphagenome-avi-phred"
      - --model
      - clingen-score-table
      - --model-name
      - AlphaGenome AVI (PHRED)
      - --training-overlap
      - No ClinVar supervision; trained on gnomAD allele-frequency structure (rare AF<0.1% stratum isolates label confounding).
      - --batch-size
      - "4096"
      - --adapter-options
      - '{"artifact": "{inputs}/scores_avi.tsv", "artifact_sha256": "9a873bf165a596f07f703c175532276700ed0aae55e9c87d29ea7541279e0501", "column": "avi_phred"}'
  - name: run-alphamissense
    argv:
      - rewirebench
      - run
      - --prepared
      - "{work}/prepared_001_d3"
      - --output
      - "{output}/alphamissense"
      - --model
      - clingen-score-table
      - --model-name
      - AlphaMissense
      - --training-overlap
      - Weakly supervised using primate population frequency and AlphaFold structure; no ClinVar labels.
      - --allow-partial
      - --batch-size
      - "4096"
      - --adapter-options
      - '{"artifact": "{inputs}/scores_am.tsv", "artifact_sha256": "4d5e091bff4737650da0e82259fe8cdded8df6128e7640d84da5c1ff6a4bb5fd", "column": "alphamissense"}'
  - name: run-revel
    argv:
      - rewirebench
      - run
      - --prepared
      - "{work}/prepared_001_d3"
      - --output
      - "{output}/revel"
      - --model
      - clingen-score-table
      - --model-name
      - REVEL v1.3
      - --training-overlap
      - Ensemble trained on HGMD and UniProt before Dec 2023; post-2023-12 ClinVar cohort is temporally held out.
      - --allow-partial
      - --batch-size
      - "4096"
      - --adapter-options
      - '{"artifact": "{inputs}/scores_revel.tsv", "artifact_sha256": "a2e4466f585556ffe2a972c9e4c10a2046eddb1fc5b40dc8b66473383103b90e", "column": "revel"}'
  - name: run-cadd-v1-7
    argv:
      - rewirebench
      - run
      - --prepared
      - "{work}/prepared_1_d1"
      - --output
      - "{output}/cadd-v1-7"
      - --model
      - clingen-score-table
      - --model-name
      - CADD v1.7 (PHRED)
      - --training-overlap
      - Trained on simulated vs human-derived neutral variants and genomic features before Dec 2023.
      - --batch-size
      - "4096"
      - --adapter-options
      - '{"artifact": "{inputs}/scores_cadd.tsv", "artifact_sha256": "58b427e2e85c30299af5a0464e9f552c92b80d6423bba3cf26cf8c8f3add8a14", "column": "cadd_phred"}'
