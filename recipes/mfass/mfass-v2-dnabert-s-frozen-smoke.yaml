schema_version: "1.0"
id: mfass-v2-dnabert-s-frozen-smoke
title: MFASS v2 frozen-encoder check with DNABERT-S on CPU
summary: >-
  Prepares the first 1,000 training and 1,000 held-out MFASS v2 variants from the two
  published tables, embeds each reference and mutant window with the pinned DNABERT-S
  checkpoint and fits the protocol's logistic probe. It checks that the adapter runs end to
  end; it is not a full result.
kind: model_run
purpose: obtain_and_run
scope: selected_assay
rewirebench_protocol: mfass-v2-frozen-encoder
licence:
  code: MIT
  weights: Apache-2.0 (model card metadata and Hugging Face API response); not gated. No licence is stated for the code repository.
  data: Reuse terms are unreported upstream (KosuriLab/MFASS). The data is fetched, not redistributed.
