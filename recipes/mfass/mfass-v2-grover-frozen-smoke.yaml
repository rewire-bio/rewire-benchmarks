commands:
  - name: prepare
    argv:
      - rewirebench
      - prepare
      - mfass-v2-frozen-encoder
      - --source
      - "{inputs}"
      - --output
      - "{work}/prepared"
      - --options
      - '{"limit": 1000}'
  - name: run-model
    argv:
      - rewirebench
      - run
      - --prepared
      - "{work}/prepared"
      - --output
      - "{output}/run"
      - --model
      - grover-frozen
      - --adapter-options
      - '{"checkpoint": "{inputs}", "device": "cpu"}'
outputs:
  - run/report.json
  - run/predictions.json
expected_output:
  description: >-
    The first 1,000 held-out variants in source order are scored. The probe's metrics depend
    on the model and are not checked until a run has been reviewed.
  values:
    - label: Coverage, scored
      metric_id: coverage_scored
      file: run/report.json
      key: [coverage, scored]
      value: 1000
      tolerance: 0
estimate:
  gpu_hours: 0
  note: No GPU and no paid compute.
backends:
  local: {}
limitations:
  - Not yet run, so no wall time, memory or metric is recorded.
  - prepare takes the first 1,000 rows of each split in source order and has no seeded or
    stratified sample option. The limit was set without running prepare, so a run stops at the
    probe if those training rows hold one outcome class.
  - The licence is read from the Zenodo deposit; the Hugging Face copy states none.
  - The local backend runs in the host Python environment, which needs
    rewirebench[transformers-4-41].
