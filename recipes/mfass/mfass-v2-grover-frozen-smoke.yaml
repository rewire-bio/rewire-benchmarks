schema_version: "1.0"
id: mfass-v2-grover-frozen-smoke
title: MFASS v2 frozen-encoder check with GROVER on CPU
summary: >-
  Prepares the first 1,000 training and 1,000 held-out MFASS v2 variants from the two
  published tables, embeds each reference and mutant window with the pinned GROVER checkpoint
  and fits the protocol's logistic probe. It checks that the adapter runs end to end; it is
  not a full result.
kind: model_run
purpose: obtain_and_run
scope: selected_assay
rewirebench_protocol: mfass-v2-frozen-encoder
licence:
  code: MIT
  weights: >-
    CC BY 4.0, from the authors' Zenodo deposit of the same model; the Hugging Face card
    states no licence. Not redistributed: the recipe fetches the weights from the developer's
    repository at the pinned revision. Not gated.
  data: Reuse terms are unreported upstream (KosuriLab/MFASS). The data is fetched, not redistributed.
environment:
  runtime: python
  python: ">=3.11"
  images:
