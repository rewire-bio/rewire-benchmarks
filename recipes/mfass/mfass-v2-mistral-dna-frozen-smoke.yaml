schema_version: "1.0"
id: mfass-v2-mistral-dna-frozen-smoke
title: MFASS v2 frozen-encoder check with Mistral-DNA-v1-138M-hg38 on CPU
summary: >-
  Prepares the first 1,000 training and 1,000 held-out MFASS v2 variants from the two
  published tables, embeds each reference and mutant window with the pinned
  Mistral-DNA-v1-138M-hg38 checkpoint and fits the protocol's logistic probe. It checks that
  the adapter runs end to end; it is not a full result.
kind: model_run
purpose: obtain_and_run
scope: selected_assay
rewirebench_protocol: mfass-v2-frozen-encoder
licence:
  code: MIT
  weights: Apache-2.0 (model card metadata and Hugging Face API response); not gated.
  data: Reuse terms are unreported upstream (KosuriLab/MFASS). The data is fetched, not redistributed.
environment:
  runtime: python
  python: ">=3.11"
  images:
    linux/amd64:
      missing:
        reason: unavailable
        note: No published image carries the mistral-dna extra yet.
    linux/arm64:
      missing:
        reason: unavailable
        note: No published image carries the mistral-dna extra yet.
