commands:
  - name: prepare
    argv:
      - rewirebench
      - prepare
      - flip2-fitness-v1
      - --source
      - "{inputs}/smoke.csv"
      - --output
      - "{work}/prepared"
      - --options
      - '{"dataset": "flip2-amylase-one-to-many", "allow_unverified": true, "limit": 3}'
  - name: run-model
    argv:
      - rewirebench
      - run
      - --prepared
      - "{work}/prepared"
      - --output
      - "{output}/run"
      - --model
      - glm2-150m-embeddings
      - --adapter-options
      - '{"checkpoint": "{inputs}", "device": "cpu"}'
outputs:
  - run/report.json
  - run/predictions.json
expected_output:
  description: >-
    Three synthetic test rows are scored; nothing else is stable enough to check.
  values:
    - label: Coverage, scored
      metric_id: coverage_scored
      file: run/report.json
      key: [coverage, scored]
      value: 3
      tolerance: 0
estimate:
  gpu_hours: 0
