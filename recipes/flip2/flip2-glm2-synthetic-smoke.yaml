schema_version: "1.0"
id: flip2-glm2-synthetic-smoke
title: FLIP2 plumbing check with gLM2-150M protein embeddings on CPU
summary: >-
  Embeds the eight-row synthetic FLIP2 table with the pinned gLM2-150M checkpoint, each
  protein as one coding element, and fits the protocol's ridge probe on three training rows.
  It checks that the adapter runs end to end. It is not a benchmark result.
kind: model_run
purpose: obtain_and_run
scope: synthetic_smoke
rewirebench_protocol: flip2-fitness-v1
licence:
  code: MIT
  weights: >-
    Apache-2.0 (model card metadata). Not redistributed: the recipe fetches the weights from
    the developer's repository at the pinned revision. Not gated.
  data: Synthetic fixture in this repository, MIT.
