limitations:
  - Not yet run, so no wall time, memory or metric is recorded.
  - Synthetic rows with allow_unverified, so the result says nothing about any model.
  - The checkpoint's own model and tokenizer code runs (trust_remote_code); its three Python
    files are pinned by SHA-256 like the weights.
  - The local backend runs in the host Python environment, which needs
    rewirebench[transformers-4-41].
