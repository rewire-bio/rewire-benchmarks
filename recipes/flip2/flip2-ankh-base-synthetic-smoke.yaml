schema_version: "1.0"
id: flip2-ankh-base-synthetic-smoke
title: FLIP2 plumbing check with Ankh Base embeddings on CPU
summary: >-
  Embeds the eight-row synthetic FLIP2 table with the encoder of the pinned Ankh Base
  checkpoint and fits the protocol's ridge probe on three training rows. It checks that the
  adapter runs end to end. It is not a benchmark result.
kind: model_run
purpose: obtain_and_run
scope: synthetic_smoke
rewirebench_protocol: flip2-fitness-v1
licence:
  code: MIT
  weights: >-
    CC BY-NC-SA 4.0 (model card metadata and README): licensed for non-commercial use only.
    Not redistributed: the recipe fetches the weights from the developer's repository at the
    pinned revision. The weights are not modified. Not gated.
  data: Synthetic fixture in this repository, MIT.
environment:
  runtime: python
  python: ">=3.11"
  images:
    linux/amd64:
      missing:
        reason: unavailable
        note: No published image carries the transformers-4-41 extra yet.
    linux/arm64:
      missing:
        reason: unavailable
        note: No published image carries the transformers-4-41 extra yet.
