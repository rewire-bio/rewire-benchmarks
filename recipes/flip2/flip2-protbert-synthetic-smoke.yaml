schema_version: "1.0"
id: flip2-protbert-synthetic-smoke
title: FLIP2 plumbing check with ProtBert embeddings on CPU
summary: >-
  Embeds the eight-row synthetic FLIP2 table with the pinned ProtBert checkpoint and fits the
  protocol's ridge probe on three training rows. It checks that the adapter runs end to end.
  It is not a benchmark result.
kind: model_run
purpose: obtain_and_run
scope: synthetic_smoke
rewirebench_protocol: flip2-fitness-v1
licence:
  code: MIT
  weights: Academic Free License v3.0 (ProtTrans README); the model card declares none.
  data: Synthetic fixture in this repository, MIT.
environment:
  runtime: python
  python: ">=3.11"
  images:
    linux/amd64:
      missing:
        reason: unavailable
        note: No published image carries the protbert extra yet.
    linux/arm64:
      missing:
        reason: unavailable
        note: No published image carries the protbert extra yet.
