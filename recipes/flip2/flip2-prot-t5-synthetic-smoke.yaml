schema_version: "1.0"
id: flip2-prot-t5-synthetic-smoke
title: FLIP2 plumbing check with ProtT5-XL-U50 encoder embeddings on CPU
summary: >-
  Embeds the eight-row synthetic FLIP2 table with the pinned ProtT5-XL-U50 encoder and fits
  the protocol's ridge probe on three training rows. It checks that the adapter runs end to
  end. It is not a benchmark result.
kind: model_run
purpose: obtain_and_run
scope: synthetic_smoke
rewirebench_protocol: flip2-fitness-v1
licence:
  code: MIT
  weights: >-
    Academic Free License v3.0 (ProtTrans README); the model card declares none. Not
    redistributed: the recipe fetches the weights from the developer's repository at the
    pinned revision. Not gated.
  data: Synthetic fixture in this repository, MIT.
