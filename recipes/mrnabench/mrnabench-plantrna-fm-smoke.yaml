schema_version: "1.0"
id: mrnabench-plantrna-fm-smoke
title: mRNABench designed MRL check with PlantRNA-FM embeddings on CPU
summary: >-
  Prepares 50 training, 50 validation and 50 held-out sequences of the pinned mRNABench Sample
  designed MRL dataset, embeds them with the pinned PlantRNA-FM checkpoint and fits the
  protocol's ridge probe. It checks that the adapter runs end to end; it is not a full result.
kind: model_run
purpose: obtain_and_run
scope: selected_assay
rewirebench_protocol: mrnabench-sample-mrl-v1
licence:
  code: MIT
  weights: MIT (model card, README and Hugging Face API response); not gated.
  data: Reuse terms are unreported upstream (morrislab/mrl-sample). The parquet file is fetched, not redistributed.
environment:
  runtime: python
  python: ">=3.11"
  images:
    linux/amd64:
      missing:
        reason: unavailable
        note: No published image carries the plantrna-fm extra yet.
    linux/arm64:
      missing:
        reason: unavailable
        note: No published image carries the plantrna-fm extra yet.
