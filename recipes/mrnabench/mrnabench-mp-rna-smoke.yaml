commands:
  - name: prepare
    argv:
      - rewirebench
      - prepare
      - mrnabench-sample-mrl-v1
      - --source
      - "{inputs}"
      - --output
      - "{work}/prepared"
      - --options
      - '{"dataset": "designed", "target": "target_mrl_designed", "require_official": true, "limit": 50}'
  - name: run-model
    argv:
      - rewirebench
      - run
      - --prepared
      - "{work}/prepared"
      - --output
      - "{output}/run"
      - --model
      - mp-rna-embeddings
      - --adapter-options
      - '{"checkpoint": "{inputs}", "device": "cpu"}'
outputs:
  - run/report.json
  - run/predictions.json
expected_output:
  description: >-
    The first 50 held-out sequences of the canonical split are scored. The probe's metrics are
    not checked until a run has been reviewed.
  values:
    - label: Coverage, scored
      metric_id: coverage_scored
      file: run/report.json
      key: [coverage, scored]
      value: 50
      tolerance: 0
estimate:
  gpu_hours: 0
  note: No GPU and no paid compute.
backends:
  local: {}
limitations:
  - Not yet run, so no wall time, memory or metric is recorded.
  - The checkpoint's own model code runs (trust_remote_code); its two Python files are pinned
    by SHA-256 like the weights.
  - The local backend runs in the host Python environment, which needs
    rewirebench[transformers-4-41,viennarna,sequence].
