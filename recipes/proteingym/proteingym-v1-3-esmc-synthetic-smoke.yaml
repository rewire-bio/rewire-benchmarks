schema_version: "1.0"
id: proteingym-v1-3-esmc-synthetic-smoke
title: ProteinGym v1.3 DMS check with ESM C 600M masked marginals on CPU
summary: >-
  Scores the 10-row synthetic assay table keyed to A0A247D711_LISMN_Stadelmann_2021 with ESM C
  600M masked marginals. It checks that the adapter runs end to end. It is not a biological
  result.
kind: model_run
purpose: obtain_and_run
scope: synthetic_smoke
rewirebench_protocol: proteingym-v1.3-dms-substitutions
licence:
  code: MIT
  weights: >-
    MIT plus an other entry for the repository's third-party notice (model card metadata); use
    is subject to the developers' acceptable use policy. Not redistributed: the recipe fetches
    the weights from the developer's repository at the pinned revision. Not gated.
  data: Synthetic single-substitution table built against the packaged DMS_substitutions.csv reference sequence, MIT.
environment:
  runtime: python
  python: ">=3.11"
  images:
    linux/amd64:
      missing:
        reason: unavailable
        note: No published image carries the transformers-5-16 extra yet.
    linux/arm64:
      missing:
        reason: unavailable
        note: No published image carries the transformers-5-16 extra yet.
