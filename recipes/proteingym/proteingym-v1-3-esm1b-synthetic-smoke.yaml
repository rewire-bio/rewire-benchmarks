schema_version: "1.0"
id: proteingym-v1-3-esm1b-synthetic-smoke
title: ProteinGym v1.3 DMS check with ESM-1b masked marginals on CPU
summary: >-
  Scores the 10-row synthetic assay table keyed to A0A247D711_LISMN_Stadelmann_2021 with
  ESM-1b masked marginals from the pinned transformers port. It checks that the adapter runs
  end to end. It is not a biological result.
kind: model_run
purpose: obtain_and_run
scope: synthetic_smoke
rewirebench_protocol: proteingym-v1.3-dms-substitutions
licence:
  code: MIT
  weights: MIT (model card metadata and Hugging Face API response); not gated.
  data: Synthetic single-substitution table built against the packaged DMS_substitutions.csv reference sequence, MIT.
environment:
  runtime: python
  python: ">=3.11"
  images:
    linux/amd64:
      missing:
        reason: unavailable
        note: No published image carries the esm1b extra yet.
