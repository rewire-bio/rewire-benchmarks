commands:
  - name: prepare
    argv:
      - rewirebench
      - prepare
      - proteingym-v1.3-dms-substitutions
      - --source
      - "{inputs}"
      - --output
      - "{work}/prepared"
      - --options
      - '{"assay_ids": ["A0A247D711_LISMN_Stadelmann_2021"], "limit": 10}'
  - name: run-model
    argv:
      - rewirebench
      - run
      - --prepared
      - "{work}/prepared"
      - --output
      - "{output}/run"
      - --model
      - esm1b-masked-marginal
      - --adapter-options
      - '{"checkpoint": "{inputs}", "device": "cpu"}'
outputs:
  - run/report.json
  - run/predictions.json
expected_output:
  description: >-
    All 10 synthetic mutants of the 87-residue protein are scored.
  values:
    - label: Coverage, scored
      metric_id: coverage_scored
      file: run/report.json
      key: [coverage, scored]
      value: 10
      tolerance: 0
estimate:
  gpu_hours: 0
  note: No GPU and no paid compute.
backends:
  local: {}
limitations:
  - Not yet run, so no wall time, memory or metric is recorded.
  - The weights are the transformers port biohub/esm1b_t33_650M_UR50S, not the fair-esm file
    ProteinGym scored; their equivalence is not checked here.
  - ESM-1b is depth tier 2 in the data repository.
  - The local backend runs in the host Python environment, which needs rewirebench[esm1b].
