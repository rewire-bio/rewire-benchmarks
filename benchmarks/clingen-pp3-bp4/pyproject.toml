[project]
name = "clingen-pp3-bp4"
version = "0.1.0"
description = "ClinGen PP3/BP4 local posterior calibration benchmark on temporally held-out ClinVar missense SNVs"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["rewirebench"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clingen_pp3_bp4"]
