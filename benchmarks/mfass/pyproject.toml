[project]
name = "mfass"
version = "0.1.0"
description = "MFASS splice-variant prioritisation benchmark"
requires-python = ">=3.11"
dependencies = ["rewirebench"]

[project.scripts]
mfass-build = "mfass.build_dataset:main"
mfass-split = "mfass.split:main"
mfass-baseline = "mfass.run_baseline:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mfass"]
