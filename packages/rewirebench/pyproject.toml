[project]
name = "rewirebench"
version = "0.6.2"
description = "Shared machinery for rewire.it benchmarks: grouping, splits, metrics, result schema"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.26", "scikit-learn>=1.4", "scipy>=1.11", "pydantic>=2.7,<3", "pyyaml>=6,<7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rewirebench"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[project.scripts]
rewirebench = "rewirebench.cli:main"

[project.optional-dependencies]
sequence = ["pandas>=2,<3", "pyarrow>=17,<24", "h5py>=3.10,<4"]
dnabert2 = ["torch==2.2.2", "transformers==4.29.2", "einops==0.6.1", "safetensors==0.7.0", "numpy==1.26.4"]
esm = ["fair-esm==2.0.0", "torch==2.2.2", "numpy==1.26.4"]
mcp = ["mcp>=1.12,<2"]
mistral-dna = ["torch==2.2.2", "transformers==4.41.1", "safetensors==0.7.0", "numpy==1.26.4"]
dnabert-s = ["torch==2.2.2", "transformers==4.27.0", "einops==0.6.1", "numpy==1.26.4"]
plantrna-fm = ["torch==2.2.2", "transformers==4.41.1", "safetensors==0.7.0", "numpy==1.26.4"]
protbert = ["torch==2.2.2", "transformers==4.41.1", "numpy==1.26.4"]
esm1b = ["torch==2.2.2", "transformers==4.41.1", "numpy==1.26.4"]
protgpt2 = ["torch==2.2.2", "transformers==4.41.1", "numpy==1.26.4"]
transformers-4-41 = ["torch==2.2.2", "transformers==4.41.1", "safetensors==0.7.0", "einops==0.6.1",
                     "sentencepiece==0.2.0", "numpy==1.26.4"]
transformers-5-16 = ["torch==2.5.1", "transformers==5.16.0", "safetensors==0.8.0", "numpy==1.26.4"]
