[project]
name = "rewirebench"
version = "0.1.0"
description = "Shared machinery for rewire.it benchmarks: grouping, splits, metrics, result schema"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scikit-learn>=1.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rewirebench"]
