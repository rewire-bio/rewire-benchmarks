[project]
name = "rewire-benchmarks"
version = "0.1.0"
description = "Independent, reproducible benchmarks for AI models in biology"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["rewirebench", "mfass"]

[tool.uv]
# Each set holds extras that pin different transformers versions.
conflicts = [
    [{ package = "rewirebench", extra = "dnabert2" }, { package = "rewirebench", extra = "dnabert-s" }, { package = "rewirebench", extra = "mistral-dna" }],
    [{ package = "mfass", extra = "dnabert2-pilot" }, { package = "rewirebench", extra = "mistral-dna" }],
    [{ package = "rewirebench", extra = "dnabert2" }, { package = "rewirebench", extra = "dnabert-s" }, { package = "rewirebench", extra = "plantrna-fm" }],
    [{ package = "mfass", extra = "dnabert2-pilot" }, { package = "rewirebench", extra = "plantrna-fm" }],
    [{ package = "rewirebench", extra = "dnabert2" }, { package = "rewirebench", extra = "dnabert-s" }, { package = "rewirebench", extra = "protbert" }],
    [{ package = "mfass", extra = "dnabert2-pilot" }, { package = "rewirebench", extra = "protbert" }],
    [{ package = "rewirebench", extra = "dnabert2" }, { package = "rewirebench", extra = "dnabert-s" }, { package = "rewirebench", extra = "esm1b" }],
    [{ package = "mfass", extra = "dnabert2-pilot" }, { package = "rewirebench", extra = "esm1b" }],
    [{ package = "rewirebench", extra = "dnabert2" }, { package = "rewirebench", extra = "dnabert-s" }, { package = "rewirebench", extra = "protgpt2" }],
    [{ package = "mfass", extra = "dnabert2-pilot" }, { package = "rewirebench", extra = "protgpt2" }],
    [{ package = "mfass", extra = "dnabert2-pilot" }, { package = "rewirebench", extra = "dnabert-s" }],
]

[tool.uv.workspace]
members = ["packages/*", "benchmarks/*"]
exclude = ["benchmarks/mrnabench"]

[tool.uv.sources]
rewirebench = { workspace = true }
mfass = { workspace = true }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "pandas>=2,<3", "rewirebench[mcp]"]

[tool.ruff]
line-length = 100
