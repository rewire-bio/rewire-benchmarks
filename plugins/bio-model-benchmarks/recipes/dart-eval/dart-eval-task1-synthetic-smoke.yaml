schema_version: "1.0"
id: dart-eval-task1-synthetic-smoke
title: DART-Eval Task 1 synthetic smoke check on CPU
summary: >-
  Runs the seeded random ranking control through dart-eval-task1-zero-shot-v1 on a 12-pair
  synthetic DNA fixture matching the packaged demo structure. It checks that prepare, run
  and receipt work offline without HDF5. It is not a biological result.
kind: benchmark_run
purpose: harness_run
scope: synthetic_smoke
rewirebench_protocol: dart-eval-task1-zero-shot-v1
licence:
  code: MIT
  weights: No pretrained weights.
  data: Synthetic random DNA fixture generated by dinucleotide shuffle in this repository, MIT.
environment:
  runtime: python
  python: ">=3.11"
  images:
    linux/amd64:
      reference: ghcr.io/rewire-bio/rewirebench@sha256:eb392e97f6b43c7d18220c5e6f6e2dc00a210ae47d54309c5a878aa36ee462da
    linux/arm64:
      reference: ghcr.io/rewire-bio/rewirebench@sha256:a24c0ba55c51b1e4b6769099fe2d19d210c8f23740fdec1576671d355c7bf63c
hardware_floor:
  accelerator:
    kind: none
  basis: measured_by_rewire
  note: CPU only. Finishes in under two seconds on 12 synthetic pairs.
missing:
  weights_pin:
    reason: inapplicable
    note: The seeded random control uses no pretrained weights.
inputs:
  - name: dart_eval_smoke.json
    repo_path: workflows/benchmark/examples/dart_eval_smoke.json
    sha256: 99f19079836e616829c4254d5f79debb17dfc7b86e9d56a84842fa545380a94e
    bytes: 9566
commands:
  - name: prepare
    argv:
      - rewirebench
      - prepare
      - dart-eval-task1-zero-shot-v1
      - --source
      - "{inputs}/dart_eval_smoke.json"
      - --output
      - "{work}/prepared"
      - --options
      - '{"source_sha256": "99f19079836e616829c4254d5f79debb17dfc7b86e9d56a84842fa545380a94e"}'
  - name: run-baselines
    argv:
      - rewirebench
      - run-baselines
      - --prepared
      - "{work}/prepared"
      - --output
      - "{output}/baselines"
      - --baseline
      - seeded-random-v1
outputs:
  - baselines/baseline-manifest.json
  - baselines/seeded-random-v1/report.json
  - baselines/seeded-random-v1/predictions.json
expected_output:
  description: >-
    All 12 synthetic pairs (24 sequences) are scored by seeded-random-v1. Sequence IDs are
    salted per run, so accuracy varies between runs and only counts are checked.
  values:
    - label: Scored sequences
      metric_id: n
      file: baselines/seeded-random-v1/report.json
      key: [metrics, n]
      value: 24
      tolerance: 0
    - label: Scored pairs
      metric_id: n_pairs
      file: baselines/seeded-random-v1/report.json
      key: [metrics, n_pairs]
      value: 12
      tolerance: 0
    - label: Coverage, scored
      metric_id: coverage_scored
      file: baselines/seeded-random-v1/report.json
      key: [coverage, scored]
      value: 24
      tolerance: 0
estimate:
  gpu_hours: 0
  note: No GPU and no paid compute.
backends:
  local: {}
limitations:
  - Synthetic DNA fixture only; the official ENCODE cCRE data (Synapse syn64314109 version 1) requires authenticated Synapse access and returns HTTP 403 anonymously.
  - Seeded random control only; not a biological or published model evaluation.
